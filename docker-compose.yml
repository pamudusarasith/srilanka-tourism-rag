services:
  postgres:
    image: postgres:16
    container_name: tourism_rag_db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: tourism
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d tourism"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
